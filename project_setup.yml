---
- name: Configure development workspace
  hosts: local
  connection: local
  gather_facts: true

  vars:
    project_name: "devops_project"
    workspace_path: "{{ ansible_env.HOME }}/{{ project_name }}"
    student_name: "Priyajit Biswal"
    workspace_purpose: "Development workspace for Ansible configuration management"

  tasks:
    - name: Create main project directory
      ansible.builtin.file:
        path: "{{ workspace_path }}"
        state: directory
        mode: "0755"

    - name: Create project subdirectories
      ansible.builtin.file:
        path: "{{ workspace_path }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - src
        - logs
        - reports

    - name: Create project information file
      ansible.builtin.copy:
        dest: "{{ workspace_path }}/project_info.txt"
        content: |
          Project Name: {{ project_name }}
          Student Name: {{ student_name }}
          Purpose: {{ workspace_purpose }}
        mode: "0644"

    - name: Create workspace status file
      ansible.builtin.copy:
        dest: "{{ workspace_path }}/reports/status.txt"
        content: "The workspace has been configured successfully.\n"
        mode: "0644"

    - name: Display completion message
      ansible.builtin.debug:
        msg: "Workspace {{ project_name }} configured successfully at {{ workspace_path }}"
